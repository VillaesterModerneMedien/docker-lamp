      - /Users/whykiki/srv/git/docker-lamp/.config/php/php-global-overrides.ini:/usr/local/etc/php/conf.d/z00-php-global-overrides.ini:rw
      - /Users/whykiki/srv/git/docker-lamp/.config/php/php-xdebug-3.x.ini:/usr/local/etc/php/conf.d/z10-php-xdebug-3.x.ini:rw
      - /Users/whykiki/srv:/srv:rw
